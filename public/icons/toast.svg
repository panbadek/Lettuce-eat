<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="połówka tosta">
  <!-- Right isosceles triangle (90°/45°/45°): right angle bottom-left, cut edge along the hypotenuse. -->
  <defs>
    <clipPath id="half"><path d="M6 6 L6 58 L58 58 Z"/></clipPath>
  </defs>
  <!-- melted cheese oozing out of the cut -->
  <path d="M5 8 L8 5 L59 56 L56 59 Z" fill="#FFC928"/>
  <ellipse cx="22.5" cy="19.5" rx="2.8" ry="5" fill="#FFC928" transform="rotate(45 22.5 19.5)"/>
  <ellipse cx="40.5" cy="37.5" rx="2.5" ry="4.2" fill="#FFC928" transform="rotate(45 40.5 37.5)"/>
  <!-- toasted bread -->
  <path d="M6 6 L6 58 L58 58 Z" fill="#EDB55A"/>
  <g clip-path="url(#half)" stroke="#B66E28" stroke-width="3.2" stroke-linecap="round" opacity="0.6">
    <path d="M-4 40 L28 72"/>
    <path d="M-4 26 L42 72"/>
    <path d="M-4 12 L56 72"/>
  </g>
  <!-- crust along the two legs -->
  <path d="M6 6 L6 58 L58 58" fill="none" stroke="#9A5520" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
