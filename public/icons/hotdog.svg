<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="mały hot dog z Żabki">
  <!-- Żabka-style (French) hot dog: closed long bun, sausage sticking well out of one end, green paper sleeve. -->
  <defs>
    <clipPath id="sleeve">
      <path d="M26 18 L16 18 A12 14 0 0 0 16 46 L26 46 L23.5 42 L26 38 L23.5 34 L26 30 L23.5 26 L26 22 Z"/>
    </clipPath>
  </defs>
  <g transform="rotate(-30 32 32)">
    <!-- sausage, well over a third of it outside the bun -->
    <rect x="30" y="25.5" width="32" height="13" rx="6.5" fill="#C9472C"/>
    <rect x="42" y="27.8" width="17" height="3" rx="1.5" fill="#E9785C"/>
    <!-- bun -->
    <rect x="5" y="20" width="34" height="24" rx="12" fill="#E3A04C"/>
    <rect x="11" y="23" width="23" height="5" rx="2.5" fill="#F4C67E"/>
    <!-- ketchup around the opening -->
    <path d="M37.5 25.5 q4 0 4 6.5 q0 6.5 -4 6.5" fill="none" stroke="#D8261C" stroke-width="3" stroke-linecap="round"/>
    <!-- paper sleeve wrapped around the closed end -->
    <path d="M26 18 L16 18 A12 14 0 0 0 16 46 L26 46 L23.5 42 L26 38 L23.5 34 L26 30 L23.5 26 L26 22 Z" fill="#169443"/>
    <rect x="0" y="29" width="30" height="6" fill="#FFFFFF" clip-path="url(#sleeve)"/>
    <path d="M26 18 L16 18 A12 14 0 0 0 16 46 L26 46" fill="none" stroke="#0E6E31" stroke-width="1.5"/>
  </g>
</svg>
